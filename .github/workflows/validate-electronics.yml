name: Validate Electronics Curriculum

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Reflex Guard kernel
        working-directory: electronics
        run: python tools/validate_kernel_spec.py kernels/threshold_reflex_v0
      - name: Validate golden trace
        working-directory: electronics
        run: python tools/validate_trace.py kernels/threshold_reflex_v0/traces/golden_trace.jsonl
      - name: Replay golden trace
        working-directory: electronics
        run: python tools/replay_trace.py kernels/threshold_reflex_v0/traces/golden_trace.jsonl
